group 'com.famproperties.amazon_s3_cognito'
version '0.3.1'

buildscript {
    ext.kotlin_version = '2.3.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {

    namespace 'com.famproperties.amazon_s3_cognito'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }
    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'com.amazonaws:aws-android-sdk-core:2.81.1'
    implementation 'com.amazonaws:aws-android-sdk-s3:2.81.1'
}
